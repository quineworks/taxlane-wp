# platform#561, part 2/3 (platform#564). #563 shipped `decideClose()` (a
# pure function over a sub-issues list + hold-label flag) plus its fixture
# test — this workflow is the live entrypoint that calls it.
#
# GitHub's native Sub-issues REST API is both the candidate-parent-discovery
# and the enumeration mechanism, so there's no timeline/regex scanning here
# (that was the superseded first design, see #561's 2026-07-11 15:40:40/
# 15:45:22 comments): `GET /repos/{owner}/{repo}/issues/{n}/parent` on the
# just-closed issue resolves its tracking parent (404 -> no parent, exit
# clean); `GET .../sub_issues` on that parent returns the full enumerated
# list decideClose() decides against. A parent object only ever has one
# parent (confirmed against the live API, not assumed), so there's no
# multi-candidate loop like the old design needed.
#
# Same shape as issue-close-enforcer.yml: `issues: closed` trigger, no
# python3 on the self-hosted runner (`infra/ci_runner_bootstrap.sh.tftpl`),
# heredoc'd Node. Unlike issue-close-enforcer.yml this step does need
# `actions/checkout` (matching sync-governance-workflows.yml's pattern) so
# the heredoc can `require()` #563's `scripts/tracking-parent-auto-closer.cjs`
# instead of re-implementing decideClose() inline.
#
# Cross-repo tracking parents are supported by the API (same owner, not
# same repo). This used to be a real gap when every call below ran under
# the plain `github.token` (scoped to only the repo the workflow runs in,
# so it could neither read nor write a parent living in a different repo —
# "a broader-scoped token is a separate, larger decision, out of #564's
# scope"). platform#4294/#4301 made that broader-scoped token decision (see
# below) for the cross-repo sub-issue-counting fix it needed anyway, which
# incidentally also closes this gap: every `gh api`/`gh issue close` call
# below now runs under the org-wide PAT, so a cross-repo parent is both
# readable and writable like any same-repo one. The `::warning::`-then-
# exit-clean fallbacks below are kept as a defensive fail-soft (e.g. a
# transient API error), not because cross-repo access is expected to fail.
#
# platform#1064: a *readable* cross-repo parent with unreadable cross-repo
# children is a different, sneakier failure than the 403/404 above — the
# REST `sub_issues` endpoint silently omits children the token can't read
# instead of erroring, so `fetchAllSubIssues()` can return a truncated-but-
# successful list and wrongly look complete. GraphQL's `subIssuesSummary.
# total` on the parent returns the true linked count regardless of
# cross-repo read access, so it's fetched here purely to sanity-check the
# REST list's length before trusting it — `decideClose()` fails safe (logs
# a warning, leaves the parent open) if the two don't match.
#
# platform#4252: also triggers on `unlabeled` (filtered below to
# `tracking-parent-hold`) on the issue itself — previously the only trigger
# was `issues: closed` on a *sub-issue*, so if every sub-issue was already
# closed before the hold was removed (the common case), nothing re-fired
# and the parent sat open indefinitely despite the hold-guard/cto.md
# remediation being "remove the hold and let the auto-closer close it".
# `resolveTarget()` (`scripts/tracking-parent-auto-closer.cjs`) picks the
# right recheck target for each event type: the issue itself for
# `unlabeled`, its tracking parent (via `GET .../parent`, unchanged) for
# `closed`. The `if:` below can't be expressed in `on.issues.types` (GitHub
# Actions has no label-name filter there), so it's a job-level condition
# instead — any `unlabeled` event for a label other than
# `tracking-parent-hold` exits before checkout.
#
# Generic (not platform-only) — no denylist entry needed in
# bootstrap-product-repo.sh, this backfills to every product repo the same
# way closing-keyword-check.yml / issue-close-enforcer.yml did.
#
# platform#4294/#4301: both `fetchAllSubIssues()` and `fetchExpectedTotal()`
# below used to run under the plain per-run `github.token`, which GitHub
# Actions scopes to ONLY the repo the workflow is running in — it has no
# read access to any other repo at all, not even within the same org. For a
# parent with a cross-repo child (e.g. blinkblocks#142 linked to
# platform#4273), GitHub silently omits the unreadable child from both the
# REST `sub_issues` list AND the GraphQL `subIssuesSummary.total` count, so
# the two matched each other (both undercounting the same way) and
# `decideClose()`'s own fail-safe never tripped — blinkblocks#142 sat
# permanently stuck, repeatedly reopened by tracking-parent-hold-guard.yml,
# because neither number this workflow computed was ever the true one.
# #1064's fail-safe was built to catch REST-vs-GraphQL disagreement, not a
# same-direction blind spot in both.
#
# Fix: assume `quineworks-github-actions` (OIDC, trusted for the generic
# `repo:quineworks/*:*` subject — this workflow propagates to every product
# repo, not just platform, so the platform-only `github_actions_platform`
# role won't do) and fetch the org-wide `github_token` PAT from the
# field-scoped secrets broker (`infra/secrets_broker.tf`,
# `aws_iam_role_policy.github_actions_invoke_secrets_broker` already grants
# this role GET /secret access) — the same PAT every agent task already
# uses for cross-repo work (e.g. `agent/bin/link-sub-issue`). That PAT has
# real read access across every quineworks/* repo, so both fetches below now
# see the true, complete picture regardless of which repo a sub-issue lives
# in. Same shape as `status.yml`/`sync-governance-workflows.yml`'s own
# cross-repo-token fetch.
name: tracking-parent-auto-closer

on:
  issues:
    types: [closed, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: read
  id-token: write

concurrency:
  group: tracking-parent-auto-closer-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  auto-close:
    if: github.event.action == 'closed' || github.event.label.name == 'tracking-parent-hold'
    runs-on: ondemand-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::324568509417:role/quineworks-github-actions
          aws-region: us-east-1

      - name: Fetch cross-repo GitHub token
        # Reads the `github_token` field from the field-scoped secrets
        # broker (platform#2276) — see this workflow's header comment
        # (platform#4294/#4301) for why the plain `github.token` can't see
        # cross-repo sub-issues.
        run: |
          BROKER_RESPONSE=$(curl -fsS \
            --aws-sigv4 "aws:amz:us-east-1:execute-api" \
            --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
            -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
            "https://r4c8q4snw0.execute-api.us-east-1.amazonaws.com/secret?field=github_token")
          GITHUB_PAT=$(jq -r '.value' <<<"$BROKER_RESPONSE")
          echo "::add-mask::${GITHUB_PAT}"
          echo "GH_TOKEN=${GITHUB_PAT}" >> "$GITHUB_ENV"

      - name: Check for a tracking parent and auto-close it if every sub-issue is closed
        env:
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          cat > /tmp/tracking-parent-auto-closer.js <<'NODE_EOF'
          'use strict';
          const { execFileSync } = require('child_process');
          const { decideClose, resolveTarget } = require(process.env.GITHUB_WORKSPACE + '/scripts/tracking-parent-auto-closer.cjs');

          const REPO = process.env.REPO;
          const ISSUE_NUMBER = process.env.ISSUE_NUMBER;
          const EVENT_ACTION = process.env.EVENT_ACTION;

          function fetchAllSubIssues(ownerRepo, number) {
            const issues = [];
            let page = 1;
            for (;;) {
              const out = execFileSync('gh', [
                'api',
                `repos/${ownerRepo}/issues/${number}/sub_issues`,
                '-X', 'GET',
                '-f', 'per_page=100',
                '-f', `page=${page}`,
              ], { encoding: 'utf8' });
              const batch = JSON.parse(out);
              issues.push(...batch);
              if (batch.length < 100) break;
              page += 1;
            }
            return issues;
          }

          function fetchExpectedTotal(ownerRepo, number) {
            const [owner, repo] = ownerRepo.split('/');
            const query = 'query($owner:String!,$repo:String!,$number:Int!){ ' +
              'repository(owner:$owner,name:$repo){ issue(number:$number){ ' +
              'subIssuesSummary { total } } } }';
            const out = execFileSync('gh', [
              'api', 'graphql',
              '-f', `query=${query}`,
              '-f', `owner=${owner}`,
              '-f', `repo=${repo}`,
              '-F', `number=${number}`,
            ], { encoding: 'utf8' });
            return JSON.parse(out).data.repository.issue.subIssuesSummary.total;
          }

          let parent = null;
          if (EVENT_ACTION !== 'unlabeled') {
            try {
              const out = execFileSync('gh', ['api', `repos/${REPO}/issues/${ISSUE_NUMBER}/parent`], { encoding: 'utf8' });
              parent = JSON.parse(out);
            } catch (e) {
              console.log(`#${ISSUE_NUMBER} has no parent issue — nothing to do.`);
              process.exit(0);
            }
          }

          const target = resolveTarget({ eventAction: EVENT_ACTION, repo: REPO, issueNumber: Number(ISSUE_NUMBER), parent });
          if (!target) {
            console.log('::warning::Parent response missing repository/number fields — nothing to do.');
            process.exit(0);
          }
          const { repo: parentRepo, number: parentNumber } = target;

          let targetIssue;
          try {
            const out = execFileSync('gh', ['api', `repos/${parentRepo}/issues/${parentNumber}`], { encoding: 'utf8' });
            targetIssue = JSON.parse(out);
          } catch (e) {
            console.log(`::warning::Could not fetch ${parentRepo}#${parentNumber} itself ` +
              `(likely a cross-repo token scope limit — see this workflow's header comment) — nothing done.`);
            process.exit(0);
          }

          if (targetIssue.state === 'closed') {
            console.log(`${parentRepo}#${parentNumber} is already closed — nothing to do.`);
            process.exit(0);
          }

          const hasHoldLabel = Array.isArray(targetIssue.labels) &&
            targetIssue.labels.some((l) => l.name === 'tracking-parent-hold');

          let subIssues;
          try {
            subIssues = fetchAllSubIssues(parentRepo, parentNumber);
          } catch (e) {
            console.log(`::warning::Could not fetch sub-issues for parent ${parentRepo}#${parentNumber} ` +
              `(likely a cross-repo token scope limit — see this workflow's header comment) — nothing done.`);
            process.exit(0);
          }

          let expectedTotal;
          try {
            expectedTotal = fetchExpectedTotal(parentRepo, parentNumber);
          } catch (e) {
            console.log(`::warning::Could not verify the true sub-issue total for parent ` +
              `${parentRepo}#${parentNumber} via GraphQL, so the fetched list's completeness ` +
              `can't be confirmed — nothing done.`);
            process.exit(0);
          }

          const { shouldClose, reason } = decideClose(subIssues, hasHoldLabel, expectedTotal);
          console.log(`decideClose(${parentRepo}#${parentNumber}): shouldClose=${shouldClose} — ${reason}`);

          if (!shouldClose) process.exit(0);

          const closedList = subIssues.map((i) => '#' + i.number).join(', ');
          const commentBody = `All linked sub-issue(s) verified closed via the native sub-issues API: ${closedList}. ` +
            'Auto-closed by tracking-parent-auto-closer.yml (platform#561).';

          try {
            execFileSync('gh', [
              'issue', 'close', String(parentNumber),
              '--repo', parentRepo,
              '--comment', commentBody,
            ], { stdio: 'inherit' });
            console.log(`Closed ${parentRepo}#${parentNumber}.`);
          } catch (e) {
            console.log(`::warning::Found ${parentRepo}#${parentNumber} closeable but could not close it ` +
              `(likely a cross-repo token scope limit — see this workflow's header comment).`);
            process.exit(0);
          }
          NODE_EOF
          node /tmp/tracking-parent-auto-closer.js
