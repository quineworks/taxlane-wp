# tax-lane#2809 (follow-up from tax-lane#2806's root-cause diagnosis on
# tax-lane#2802): request-review.yml already self-heals a *lost* reviewer
# dispatch (#673) via the `needs-review` label -- it's set unconditionally
# on `opened`/`reopened`/`ready_for_review`, and a later `synchronize`/
# `edited` push re-enqueues a reviewer as long as that label (or
# `changes-requested`) is present. But that only covers the case where the
# enqueue step failed *after* the label was applied. #2802 showed the gap
# one level up: the `opened` event itself never fired at all (confirmed via
# `gh api repos/.../commits/<sha>/check-suites` -- zero check-suites from
# the `github-actions` app, while sibling PRs opened ~40s before/after it
# got the full normal set). When that happens, `needs-review` never gets
# set either, so no later push on that PR can ever re-trigger review -- the
# gate requires a label nothing ever applied. The PR then silently sits
# with zero labels, zero CI, zero review until a human/agent happens to
# notice (tax-lane#2802 was only caught incidentally during an unrelated
# duplicate-PR cleanup, tax-lane#2805).
#
# This workflow is the structural backstop event-driven request-review.yml
# can't reach on its own: a periodic sweep (same idea as label-enforcer.yml
# for issues, #85) over every open, non-draft PR in the repo. A PR is
# "orphaned" if it's older than AGE_THRESHOLD_SECONDS below *and* has
# neither `needs-review` nor `changes-requested` *and* has no completed
# check-suite from the `github-actions` app on its head commit. The age
# threshold exists so a PR opened seconds ago -- whose `opened` event is
# simply still in flight -- doesn't get double-enqueued by this sweep
# racing the normal path; the check-suite condition (not just "zero check
# suites") so a PR whose CI is still legitimately running isn't flagged
# just because the reviewer hasn't posted a verdict yet.
#
# An orphaned PR gets exactly what request-review.yml would have given it
# on a normal `opened` event: the `needs-review` label (so any future push
# re-enqueues normally even if this sweep doesn't catch the follow-up) and
# a reviewer job enqueued directly, same SQS message shape as
# request-review.yml's own "Enqueue reviewer job" step.
#
# platform#3393 added a second, similarly-shaped recovery class to this same
# sweep: `request-review.yml` now gates every reviewer enqueue on a
# `review-outstanding` label (set the moment it dispatches a reviewer job,
# cleared only when the reviewer posts a verdict), so at most one reviewer
# job is ever outstanding per PR. That gate creates its own single point of
# failure -- if the dispatched job itself is lost (dropped SQS delivery, a
# crashed run that never reaches the verdict-posting step), `review-
# outstanding` never clears, and nothing about the gate alone would ever
# re-trigger a fresh dispatch: unlike the "opened event never fired" case
# above, a push arriving in this state is *supposed* to no-op (the whole
# point of the gate), so there's no later event to self-heal from. This
# sweep is the backstop for that too: a PR whose `review-outstanding` label
# has sat for longer than STUCK_REVIEW_THRESHOLD_SECONDS with no verdict
# posted almost certainly lost its dispatched job, so the sweep clears the
# label, re-adds `needs-review`, and enqueues a fresh reviewer job directly
# -- same recovery action as the "never dispatched" case below, just a
# different root cause. The threshold is read from the label's own
# `labeled` timeline event (not the PR's `createdAt`/`updatedAt`, which
# would be skewed by unrelated activity like comments) so a PR that's had
# several review rounds doesn't get falsely flagged by its age.
#
# Propagated to every product repo by sync-governance-workflows.yml +
# bootstrap-product-repo.sh (not added to that script's DENYLIST -- this
# needs to run in every repo with open PRs, platform included, the same
# shape as request-review.yml/label-enforcer.yml themselves).
#
# This is a narrow edge case (one occurrence across ~15+ PRs the day it was
# caught, no actual damage since that PR was a duplicate) so the cadence
# below trades promptness for cost: every 15 minutes, not continuous
# polling, mirroring the cost-consciousness already applied to this fleet's
# other scheduled sweeps.
#
# platform#4298 (sub-issue of #4295, CEO directive): the stuck-review-
# outstanding branch above assumed "review-outstanding sat past the
# threshold with no verdict" always means the dispatched job was lost --
# but a reviewer that posts its verdict (comment, and for Request-changes
# the `changes-requested` label) and then crashes/fails *before* reaching
# the label-clearing step at the end of its run (agent/roles/reviewer.md)
# leaves review-outstanding stuck in exactly the same shape, with a verdict
# that already landed on the current head SHA. Redispatching there is pure
# waste: a second reviewer job re-reviewing a commit that was already
# judged. Before redispatching, both branches below now check whether the
# PR's *current* head SHA already carries a verdict and skip the
# enqueue (just clearing the stale label) if so -- see
# `verdict_exists_for_sha` and the `needs-ceo-decision` skip. The two
# `workflow_dispatch` inputs below default to today's real thresholds
# (20min / 10min) and exist only so this logic can be exercised live via a
# manual dispatch without waiting out the real clock.
name: orphaned-pr-sweep

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      stuck_review_threshold_seconds:
        description: "Override STUCK_REVIEW_THRESHOLD_SECONDS (testing only; defaults to the real 20min)"
        required: false
        type: string
      age_threshold_seconds:
        description: "Override AGE_THRESHOLD_SECONDS (testing only; defaults to the real 10min)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write
  # check-suites below needs this explicitly -- issues/pull-requests write
  # doesn't cover it (tax-lane#3193, HTTP 403).
  checks: read

concurrency:
  group: orphaned-pr-sweep-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ondemand-x86_64
    steps:
      - name: Ensure the needs-review label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create needs-review --repo "$REPO" --color b60205 \
            --description "PR has never received a reviewer verdict; synchronize/edited pushes should re-enqueue" \
            --force
          gh label create review-outstanding --repo "$REPO" --color 5319e7 \
            --description "Reviewer job outstanding for this PR; blocks request-review.yml from enqueueing another one" \
            --force

      - name: Find orphaned open PRs and apply needs-review
        id: sweep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STUCK_REVIEW_THRESHOLD_INPUT: ${{ inputs.stuck_review_threshold_seconds }}
          AGE_THRESHOLD_INPUT: ${{ inputs.age_threshold_seconds }}
        run: |
          AGE_THRESHOLD_SECONDS="${AGE_THRESHOLD_INPUT:-$((10 * 60))}"
          STUCK_REVIEW_THRESHOLD_SECONDS="${STUCK_REVIEW_THRESHOLD_INPUT:-$((20 * 60))}"
          NOW=$(date -u +%s)
          : > /tmp/orphaned-prs.jsonl

          # platform#4298: does the PR's current head SHA already carry a
          # recorded reviewer verdict? Deliberately does NOT check the
          # `quineworks/review-verdict` commit status here, even though
          # reviewer.md's merge step is the only place *the reviewer*
          # writes it -- live-tested against real PR#4283 (a
          # `commitment-clear/*` PR, still open on `changes-requested`) and
          # found `commitment-ledger-check.yml` also writes `success` to
          # that exact same status context on structural pass, completely
          # independent of whether the reviewer agent ever ran. Treating
          # that status's bare presence as "the reviewer already verdicted
          # this SHA" would have been a false positive on exactly this PR
          # shape and silently suppressed a redispatch a real stuck review
          # still needs -- a worse regression than the waste this fix
          # exists to remove. The one signal that's genuinely
          # reviewer-exclusive is the label: `changes-requested` is only
          # ever set by the Request-changes verdict (reviewer.md).
          #
          # An earlier version of this function paired that label with "a
          # PR comment posted after the head commit's timestamp" as the
          # signal that the verdict covers the *current* SHA. A review pass
          # on this PR (platform#4300, confirmed via repro against real
          # `platform#2287` comment history) found that heuristic is wrong:
          # every agent posts through the same shared GitHub account (see
          # reviewer.md's note that there's no separate "approval" identity),
          # so there is no author to distinguish a reviewer's verdict from an
          # engineer's own routine "pushed a fix, ready for re-review"
          # comment -- and that engineer comment is the ordinary shape of a
          # post-push update, not a rare case. Any comment landing after a
          # fresh push (new head SHA, stale `changes-requested` label still
          # carried over) would be misread as "already verdicted," clearing
          # `review-outstanding` with no redispatch and leaving the PR with
          # only `changes-requested` set -- the state the loop further below
          # treats as "normal, waiting on a fix push" and permanently skips,
          # i.e. a silently-stuck-forever PR until some unrelated future push
          # creates a new SHA.
          #
          # Fixed by keying off the `changes-requested` label's own `labeled`
          # timeline event instead of any comment: that event's timestamp is
          # set atomically with the Request-changes verdict itself (reviewer.md
          # posts the comment and applies the label in the same verdict step),
          # so it is a reviewer-exclusive signal no shared-account comment can
          # spoof. If the label was last applied *after* the current head
          # commit was created, the commit already existed at review time, so
          # the verdict covers it. If the label was last applied *before* the
          # current head commit, a push landed after the verdict (the
          # `changes-requested`-carried-over-from-a-stale-SHA case,
          # request-review.yml's `synchronize` gate also requires
          # review-outstanding absent, so that push's own re-review got
          # blocked too) and the verdict does not cover the current SHA.
          # Escalate verdicts are covered separately above via the
          # `needs-ceo-decision` label reviewer.md applies directly to the
          # PR -- not here, since Escalate never sets `changes-requested`
          # (it removes it if present) and so has no PR-level trace this
          # function alone could key on. Merge verdicts need no check here
          # at all: a merged PR is closed and never reaches this open-PRs
          # loop.
          verdict_exists_for_sha() {
            local sha="$1" labels="$2"

            if [[ ",${labels}," != *",changes-requested,"* ]]; then
              return 1
            fi

            local commit_date labeled_at
            commit_date=$(gh api "repos/${REPO}/commits/${sha}" --jq '.commit.committer.date' 2>/dev/null)
            labeled_at=$(gh api "repos/${REPO}/issues/${NUMBER}/timeline" --paginate \
              --jq '[.[] | select(.event == "labeled" and .label.name == "changes-requested")] | last | .created_at' 2>/dev/null)
            if [[ -z "$commit_date" || -z "$labeled_at" || "$labeled_at" == "null" ]]; then
              return 1
            fi
            if (( $(date -u -d "$labeled_at" +%s) > $(date -u -d "$commit_date" +%s) )); then
              return 0
            fi
            return 1
          }

          gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,title,createdAt,isDraft,labels,headRefOid \
            --jq '.[]' | while IFS= read -r PR; do
            NUMBER=$(jq -r '.number' <<<"$PR")
            TITLE=$(jq -r '.title' <<<"$PR")
            IS_DRAFT=$(jq -r '.isDraft' <<<"$PR")
            CREATED_AT=$(jq -r '.createdAt' <<<"$PR")
            SHA=$(jq -r '.headRefOid' <<<"$PR")
            LABELS=$(jq -r '[.labels[].name] | join(",")' <<<"$PR")

            if [[ "$IS_DRAFT" == "true" ]]; then
              continue
            fi

            # platform#4298: `needs-ceo-decision` is the Escalate verdict's
            # own PR-level trace (agent/roles/reviewer.md applies it
            # directly to the PR being reviewed, same label
            # services/telegram-webhook/handler.py's PARKED_PR_LABELS/
            # _is_parked already treat as known-stopped elsewhere) --
            # already-escalated work, not an orphan, regardless of which
            # branch below would otherwise fire. Checked first since
            # Escalate clears changes-requested/needs-review/
            # review-outstanding (so without this, a slow CEO decision
            # could age past either threshold and get falsely flagged).
            if [[ ",${LABELS}," == *",needs-ceo-decision,"* ]]; then
              continue
            fi

            # A PR with review-outstanding set has a reviewer job dispatched
            # for it already (request-review.yml, platform#3393) -- that's
            # the normal "review legitimately in flight" state, not an
            # orphan, unless the label has sat for too long with no verdict
            # (the dispatched job was lost). Check this before the
            # needs-review/changes-requested skip below, since
            # review-outstanding is always set alongside one of those.
            if [[ ",${LABELS}," == *",review-outstanding,"* ]]; then
              LABELED_AT=$(gh api "repos/${REPO}/issues/${NUMBER}/timeline" --paginate \
                --jq '[.[] | select(.event == "labeled" and .label.name == "review-outstanding")] | last | .created_at')
              if [[ -n "$LABELED_AT" && "$LABELED_AT" != "null" ]]; then
                LABELED_EPOCH=$(date -u -d "$LABELED_AT" +%s)
                OUTSTANDING_AGE=$((NOW - LABELED_EPOCH))
                if (( OUTSTANDING_AGE >= STUCK_REVIEW_THRESHOLD_SECONDS )); then
                  if verdict_exists_for_sha "$SHA" "$LABELS"; then
                    echo "review-outstanding stuck (${OUTSTANDING_AGE}s) but head SHA ${SHA} already has a recorded verdict for #${NUMBER} -- clearing the stale label, not redispatching (platform#4298)." >&2
                    gh pr edit "$NUMBER" --repo "$REPO" --remove-label review-outstanding
                    gh pr comment "$NUMBER" --repo "$REPO" --body \
                      "\`review-outstanding\` sat for ${OUTSTANDING_AGE}s, but the current head commit \`${SHA}\` already has a recorded reviewer verdict -- the dispatched job most likely posted it and then crashed before clearing this label. Clearing it without enqueueing a redundant reviewer (platform#4298)."
                  else
                    echo "Stuck review-outstanding detected: #${NUMBER} \"${TITLE}\" (outstanding ${OUTSTANDING_AGE}s)" >&2
                    gh pr edit "$NUMBER" --repo "$REPO" --remove-label review-outstanding
                    gh pr edit "$NUMBER" --repo "$REPO" --add-label needs-review
                    gh pr comment "$NUMBER" --repo "$REPO" --body \
                      "\`review-outstanding\` has been set for ${OUTSTANDING_AGE}s with no verdict posted -- the dispatched reviewer job likely never completed (dropped delivery, crashed run). Clearing it and enqueueing a fresh reviewer job (platform#3393)."
                    jq -nc --argjson number "$NUMBER" --arg title "$TITLE" \
                      '{number: $number, title: $title, reason: "stuck-review-outstanding"}' >> /tmp/orphaned-prs.jsonl
                  fi
                fi
              fi
              continue
            fi

            if [[ ",${LABELS}," == *",changes-requested,"* || ",${LABELS}," == *",needs-review,"* ]]; then
              continue
            fi

            CREATED_EPOCH=$(date -u -d "$CREATED_AT" +%s)
            AGE=$((NOW - CREATED_EPOCH))
            if (( AGE < AGE_THRESHOLD_SECONDS )); then
              continue
            fi

            HAS_COMPLETED=$(gh api "repos/${REPO}/commits/${SHA}/check-suites" --paginate \
              --jq '[.check_suites[]? | select(.app.slug == "github-actions" and .status == "completed")] | length')
            if [[ "${HAS_COMPLETED:-0}" -gt 0 ]]; then
              continue
            fi

            echo "Orphaned PR detected: #${NUMBER} \"${TITLE}\" (age ${AGE}s, labels: '${LABELS}')" >&2
            gh pr edit "$NUMBER" --repo "$REPO" --add-label needs-review
            gh pr comment "$NUMBER" --repo "$REPO" --body \
              "Found with no \`needs-review\`/\`changes-requested\` label and no completed CI check-suite ${AGE}s after opening -- the \`opened\` event likely never fired for this PR (tax-lane#2802/#2806). Labeling \`needs-review\` and enqueueing a reviewer directly (tax-lane#2809)."
            jq -nc --argjson number "$NUMBER" --arg title "$TITLE" \
              '{number: $number, title: $title, reason: "never-dispatched"}' >> /tmp/orphaned-prs.jsonl
          done

          if [[ -s /tmp/orphaned-prs.jsonl ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.sweep.outputs.found == 'true'
        with:
          role-to-assume: arn:aws:iam::324568509417:role/quineworks-github-actions
          aws-region: us-east-1

      - name: Enqueue reviewer jobs for orphaned PRs
        if: steps.sweep.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Same SQS message shape as request-review.yml's own "Enqueue
        # reviewer job" step, including the hand-kept chat_id note there. Also
        # sets review-outstanding right after sending, same as that step
        # does -- otherwise a push landing moments after this direct enqueue
        # would see no review-outstanding label and double-dispatch via
        # request-review.yml, reintroducing the exact bug #3393 fixes there.
        run: |
          while IFS= read -r ORPHAN; do
            NUMBER=$(jq -r '.number' <<<"$ORPHAN")
            TITLE=$(jq -r '.title' <<<"$ORPHAN")
            REASON=$(jq -r '.reason' <<<"$ORPHAN")
            if [[ "$REASON" == "stuck-review-outstanding" ]]; then
              RECOVERY_NOTE="orphaned-pr-sweep recovery -- platform#3393, stuck review-outstanding"
            else
              RECOVERY_NOTE="orphaned-pr-sweep recovery -- tax-lane#2809"
            fi
            BODY=$(jq -n \
              --arg ctx "Review PR #${NUMBER} in ${REPO}: ${TITLE} (${RECOVERY_NOTE})" \
              '{role: "reviewer", context: $ctx, chat_id: "1952896608,5209713934", depth: 1}')
            aws sqs send-message \
              --queue-url https://sqs.us-east-1.amazonaws.com/324568509417/quineworks-work \
              --message-body "$BODY"
            gh pr edit "$NUMBER" --repo "$REPO" --add-label review-outstanding
          done < /tmp/orphaned-prs.jsonl
