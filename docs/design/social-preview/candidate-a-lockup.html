<!-- @dsCard group="Social preview" name="taxlane-wp — A: brand lockup" subtitle="Dark card, mark + wordmark + WP badge" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card {
    width: 1280px;
    height: 640px;
    background: #0B8457;
    position: relative;
    display: flex;
    align-items: center;
    padding: 0 96px;
  }
  .mark {
    flex: none;
    margin-right: 56px;
  }
  .copy {
    flex: 1;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.28);
    color: #EAF6F0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 10px 22px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .badge svg { flex: none; }
  h1 {
    color: #FFFFFF;
    font-size: 64px;
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-bottom: 22px;
  }
  p.tagline {
    color: #DFF2E9;
    font-size: 30px;
    line-height: 1.4;
    font-weight: 500;
    max-width: 920px;
  }
  .stripe {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 10px;
    background: #BBDDD0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="stripe"></div>
    <svg class="mark" width="160" height="160" viewBox="0 0 32 32" fill="none">
      <rect x="6" y="23" width="5" height="9" rx="1.5" fill="#FFFFFF"/>
      <rect x="13.5" y="18" width="5" height="14" rx="1.5" fill="#FFFFFF"/>
      <rect x="21" y="12" width="5" height="20" rx="1.5" fill="#34D399"/>
    </svg>
    <div class="copy">
      <div class="badge">
        <svg width="26" height="26" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="9" stroke="#EAF6F0" stroke-width="1.6"/>
          <path d="M3 9.2c1.6-.3 2.6.5 3.3 1.6.8 1.3.9 3 2.3 3.6 1.9.8 3.6-1.4 4.2-2.9.6-1.5 1.1-3.6 2.9-3.8" stroke="#EAF6F0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </svg>
        Free WordPress Plugin
      </div>
      <h1>TaxLane Nigeria Tax Calculators</h1>
      <p class="tagline">Embed 29 always-current Nigeria tax calculators on any page with one shortcode — PAYE, VAT, CIT, Land Use Charge and more, in English, Pidgin, Hausa, Yorùbá and Igbo.</p>
    </div>
  </div>
</body>
</html>
